name: Evals

# Behavioral evals use real model calls. They count against API billing.
# Run them by hand: Actions -> Evals -> Run workflow.
#
# This workflow never runs on a pull request. The eval fixtures are shell
# scripts that run as the runner user, and a fork must not reach the API key.
# The job stops at once when the ANTHROPIC_API_KEY secret is missing.

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Minimum score for each case (0 to 1)'
        required: true
        default: '0.8'
        type: string
      max_cost_usd:
        description: 'Cost ceiling in USD (list-price estimate)'
        required: true
        default: '20'
        type: string
      model:
        description: 'Model for the agent under test'
        required: true
        default: 'claude-sonnet-5'
        type: string
      judge_model:
        description: 'Model for the LLM graders'
        required: true
        default: 'claude-haiku-4-5'
        type: string
      ablation:
        description: 'none runs the plugin arm only. with-without adds the no-plugin baseline.'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - with-without
      tag:
        description: 'Optional case tag filter. Example is smoke. Leave empty to run every case.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  eval:
    name: Run the Claude Code evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require the Claude credential
        env:
          CLAUDE_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY repository secret is not set. Add it before you run the evals."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Stop before any paid call when the package itself is broken.
      - name: Validate the package
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python scripts/sync_claude_agents.py --check
          python scripts/validate.py --require-yaml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Check the Claude Code version
        run: |
          VERSION="$(claude --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "Claude Code $VERSION"
          if [ "$(printf '%s\n' 2.1.269 "$VERSION" | sort -V | head -1)" != "2.1.269" ]; then
            echo "::error::Claude Code 2.1.269 or later is required."
            exit 1
          fi

      # The edit cases need Write and Edit. No case needs Bash.
      # The scaffold scripts run as the runner user. Only this repository supplies them.
      - name: Run the evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THRESHOLD: ${{ inputs.threshold }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
          AGENT_MODEL: ${{ inputs.model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          ABLATION: ${{ inputs.ablation }}
          CASE_TAG: ${{ inputs.tag }}
          # The cases run main thread -> coordinator -> specialist. That needs two
          # nested levels. Claude Code allows three by default. Set it so the run
          # does not depend on a runner default.
          CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH: '3'
        run: |
          args=(
            plugin eval .
            --trust-plugin
            --scaffold
            --allow-tools Write Edit
            --json eval-results.json
            --threshold "$THRESHOLD"
            --model "$AGENT_MODEL"
            --judge-model "$JUDGE_MODEL"
            --ablation "$ABLATION"
            --no-publish
            --max-cost-usd "$MAX_COST_USD"
          )
          if [ -n "$CASE_TAG" ]; then
            args+=(--tag "$CASE_TAG")
          fi
          claude "${args[@]}"

      - name: Summarize the result
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = "eval-results.json"
          print("### Eval result")
          if not os.path.exists(path):
              print("No result file. The run stopped before it wrote one.")
          else:
              data = json.load(open(path, encoding="utf-8"))
              totals = data.get("aggregates", {})
              print(f"- Cases passed: {totals.get('casesPassed')} of {totals.get('casesTotal')}")
              print(f"- Overall score: {totals.get('overallScore')}")
              print(f"- Estimated cost (USD): {data.get('costUsd')}")
              print(f"- Partial run: {data.get('partial', False)} {data.get('partialReason', '')}")
          PY

      - name: Archive the eval result and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          if-no-files-found: warn
          path: |
            eval-results.json
            evals/results/**/report.html
            evals/results/**/aggregate-result.json
