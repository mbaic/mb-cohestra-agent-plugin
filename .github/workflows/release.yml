name: Release

# Creates the tag, the GitHub release, the ZIP archive, and the checksum for one
# version. Run it by hand: Actions -> Release -> Run workflow.
#
# The workflow tags nothing until every check passes. A tag then means that this
# exact state passed validation, and that the manifests, the changelog, and the
# input all name the same version. It never runs on a push.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading v. Example is 0.1.0.'
        required: true
        default: '0.1.0'
        type: string
      draft:
        description: 'Create the release as a draft, so you can review it first'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Check, build, tag, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the default branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run the release from the default branch ($DEFAULT_BRANCH), not from $REF_NAME."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the version input
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$INPUT_VERSION' is not a version like 0.1.0. Do not add a leading v."
            exit 1
          fi
          {
            echo "version=$INPUT_VERSION"
            echo "tag=v$INPUT_VERSION"
            echo "archive=mb-cohestra-agent-plugin-v$INPUT_VERSION.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Check the Claude mirrors
        run: python scripts/sync_claude_agents.py --check

      - name: Validate the package
        run: python scripts/validate.py --require-yaml

      - name: Run the unit tests
        run: python tests/run.py

      - name: Check fixture shell syntax
        run: find evals -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Check that every version agrees with the input
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          import cohestra_common as common

          version = os.environ["VERSION"]
          root = json.load(open("plugin.json", encoding="utf-8"))
          claude = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))
          market = json.load(open(".github/plugin/marketplace.json", encoding="utf-8"))
          found = {
              "scripts/cohestra_common.py": common.PLUGIN_VERSION,
              "plugin.json": root.get("version"),
              ".claude-plugin/plugin.json": claude.get("version"),
              "marketplace metadata.version": market.get("metadata", {}).get("version"),
              "marketplace plugin entry": market["plugins"][0].get("version"),
          }
          wrong = {name: value for name, value in found.items() if value != version}
          if wrong:
              for name, value in wrong.items():
                  print(f"::error::{name} says {value!r}, but the release input is {version!r}.")
              sys.exit(1)
          print(f"All versions agree on {version}.")
          PY

      - name: Refuse to reuse a tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists. Releases are immutable. Use a new version."
            exit 1
          fi

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/release_notes.py "$VERSION" > release-notes.md
          cat release-notes.md

      - name: Build the archive and the checksum
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          python scripts/package.py --output-dir dist --require-yaml
          test -f "dist/$ARCHIVE"
          test -f "dist/$ARCHIVE.sha256"
          cd dist
          sha256sum -c "$ARCHIVE.sha256"

      - name: Create the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" -m "$(cat release-notes.md)"
          git push origin "$TAG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=()
          if [ "$DRAFT" = "true" ]; then
            flags+=(--draft)
          fi
          gh release create "$TAG" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" \
            --verify-tag \
            --title "Cohestra $TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"

      - name: Summarize the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          {
            echo "### Released \`$TAG\`"
            echo
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "- Archive: \`$ARCHIVE\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
